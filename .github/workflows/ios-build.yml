name: iOS Build (unsigned IPA)
# Disparo manual o por tag ios-* — NO en cada push (build tarda ~15 min)
on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version'
        required: false
        default: '22'
  push:
    branches: [main, develop]
    paths: ['frontend/**', 'backend/**']

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ARCHIVE_PATH: ${{ github.workspace }}/build/BargAIn.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/output
      # La IPA se construye apuntando al backend desplegado en Render.
      # EXPO_PUBLIC_* se inlinea en el bundle JS durante el archivado.
      EXPO_PUBLIC_API_URL: https://bargain-free-api.onrender.com/api/v1
      EXPO_PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ github.event.inputs.node_version || '22' }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Expo CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-expo-cli-${{ hashFiles('frontend/package.json') }}

      - name: Expo prebuild (genera directorio ios/)
        working-directory: frontend
        run: npx expo prebuild --platform ios --clean --non-interactive
        env:
          EXPO_PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_KEY }}

      - name: Verify generated workspace
        working-directory: frontend/ios
        run: |
          echo "=== Workspaces generados ==="
          find . -maxdepth 1 -type d -name "*.xcworkspace" -print | sed 's|^\./||' || true
          echo "=== Schemes disponibles ==="
          xcodebuild -list 2>/dev/null | head -20 || true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: frontend/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('frontend/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: frontend/ios
        run: pod install --repo-update

      - name: Build unsigned .xcarchive
        working-directory: frontend/ios
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ARCHIVE_PATH")"

          WORKSPACE=$(find . -maxdepth 1 -type d -name "*.xcworkspace" -print | sed 's|^\./||' | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No .xcworkspace found in $(pwd)"
            exit 1
          fi

          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | \
            awk '/Schemes:/,0' | grep -v 'Schemes:' | grep -v '^$' | head -1 | xargs)

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Could not determine an Xcode scheme from workspace $WORKSPACE"
            xcodebuild -list -workspace "$WORKSPACE" || true
            exit 1
          fi

          echo "Building workspace: $WORKSPACE, scheme: $SCHEME"
          echo "Expected archive path: $ARCHIVE_PATH"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive | xcpretty --color || \
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Verify archive exists
        run: |
          if [ -d "$ARCHIVE_PATH" ]; then
            echo "Archive found at $ARCHIVE_PATH"
            ls -la "$ARCHIVE_PATH"
          else
            echo "ERROR: archive not found at $ARCHIVE_PATH"
            echo "Workspace root: $GITHUB_WORKSPACE"
            echo "Expected export path: $EXPORT_PATH"
            echo "Discovered .xcarchive files in workspace:"
            find "$GITHUB_WORKSPACE" -maxdepth 8 -name "*.xcarchive" 2>/dev/null || true
            XCODE_ARCHIVES_DIR="$HOME/Library/Developer/Xcode/Archives"
            echo "Discovered .xcarchive files in default Xcode archive location: $XCODE_ARCHIVES_DIR"
            find "$XCODE_ARCHIVES_DIR" -maxdepth 6 -name "*.xcarchive" 2>/dev/null || true
            exit 1
          fi

      - name: Export unsigned .ipa
        run: |
          mkdir -p "$EXPORT_PATH"

          APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name "*.app" -print | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found inside archive at $ARCHIVE_PATH/Products/Applications"
            exit 1
          fi

          APP_NAME=$(basename "$APP_PATH" .app)
          PAYLOAD_DIR="$EXPORT_PATH/Payload"

          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          (
            cd "$EXPORT_PATH"
            zip -qry "${APP_NAME}-unsigned.ipa" Payload
          )

          echo "Generated unsigned IPA: $EXPORT_PATH/${APP_NAME}-unsigned.ipa"

      - name: List build output
        run: |
          echo "=== Contenido de build/output ==="
          ls -la "$EXPORT_PATH" || echo "No output directory"
          find "$GITHUB_WORKSPACE/build" -name "*.ipa" 2>/dev