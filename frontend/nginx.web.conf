server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion de texto
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache larga para los recursos con hash en el nombre
    location /_expo/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Aplicacion de pagina unica: cualquier ruta sirve index.html
    # (necesario para los enlaces directos del cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
