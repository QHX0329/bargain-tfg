# render.free.yaml — Despliegue 100% gratuito de BarGAIN en Render.
#
# A diferencia de render.yaml (que usa background workers de pago para Celery),
# este blueprint cabe entero en el free tier de Render:
#
#   1. bargain-free-api   Web Service Django (Gunicorn) + Celery worker+beat EMBEBIDOS
#   2. bargain-free-redis Key Value (Redis) gratuito — broker Celery + cache
#   3. bargain-free-db    PostgreSQL gratuito (PostGIS, caduca a los 30 días)
#
# Limitaciones aceptadas del free tier:
#   - El web service se duerme tras 15 min sin tráfico; las tareas programadas de
#     Celery beat solo corren mientras el servicio esté despierto.
#   - 512 MB RAM: el scraping con Playwright/Chromium puede provocar OOM.
#   - El Postgres gratuito caduca a los 30 días.
#
# NOTA: la API REST de Render no aplica blueprints automáticamente; este fichero
# documenta y reproduce el despliegue que se crea vía API. Para aplicarlo a mano:
# Render Dashboard -> New -> Blueprint -> seleccionar este repo y este archivo.
#
# Variables con sync: false se configuran en el Dashboard / vía API (no en el repo).

databases:
  - name: bargain-free-db
    databaseName: bargain
    user: bargain
    plan: free
    region: frankfurt

services:
  # ── Web Service: Django + Celery worker+beat embebidos ──────────────────────
  - type: web
    name: bargain-free-api
    runtime: docker
    repo: https://github.com/QHX0329/bargain-tfg
    branch: main
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: .
    dockerCommand: sh /app/scripts/start_render_free.sh
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: bargain-free-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: bargain-free-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://qhx0329.github.io,http://localhost:5173,http://localhost:3000,http://localhost:8081,http://127.0.0.1:8081
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GOOGLE_CLOUD_VISION_API_KEY
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ── Key Value (Redis) gratuito: broker Celery + cache ───────────────────────
  - type: keyvalue
    name: bargain-free-redis
    plan: free
    region: frankfurt
    ipAllowList:
      - source: 0.0.0.0/0
        description: all
    maxmemoryPolicy: noeviction
